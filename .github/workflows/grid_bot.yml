name: Grid trading bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Mettre à jour le code (si internet le permet)
        run: |
          cd ~/projet-crypto
          timeout 60 git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/noumbisdenccformation/projet-crypto.git main \
            || echo "Mise à jour impossible, on garde la version locale"

      - name: Lancer le bot
        working-directory: /home/utente/projet-crypto
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: .venv/bin/python grid_trading_bot.py
